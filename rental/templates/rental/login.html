{% extends 'rental/base.html' %}
{% load static %}

{% block title %}Đăng nhập - BookXe{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
        <div class="card-header bg-dark text-white text-center py-4">
          <i class="bi bi-car-front-fill fs-1 text-primary-blue"></i>
          <h3 class="fw-extra mt-2 mb-0" style="color: #FFFFFF !important;">Đăng nhập BookXe</h3>
          <small class="text-white-50">Chào mừng bạn quay trở lại</small>
        </div>
        <div class="card-body p-4">
          <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <div class="mb-3"><label class="form-label small fw-semibold">Tên đăng nhập</label><input type="text" name="username" class="form-control" required autofocus></div>
            <div class="mb-2">
              <label class="form-label small fw-semibold">Mật khẩu</label>
              <div class="d-flex justify-content-between align-items-center">
                <input type="password" name="password" class="form-control" required style="border-top-right-radius: 0; border-bottom-right-radius: 0;">
                <button type="button" class="btn btn-outline-secondary small px-3" style="border-top-left-radius: 0; border-bottom-left-radius: 0; height: calc(1.5em + 0.75rem + 2px);" onclick="togglePwd()"><i class="bi bi-eye-slash" id="eyeIcon"></i></button>
              </div>
            </div>
            <div class="mb-3 d-flex justify-content-between align-items-center">
              <small class="text-muted"></small>
              <a href="{% url 'password_reset' %}" class="small fw-semibold text-primary-blue" style="text-decoration: none;">Quên mật khẩu?</a>
            </div>
            <div class="d-grid"><button type="submit" class="btn btn-primary-blue btn-lg"><i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập</button></div>
          </form>
          <hr>
          <p class="text-center small text-muted mb-0">Chưa có tài khoản? <a href="{% url 'register' %}" class="fw-semibold">Đăng ký ngay</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  function togglePwd() {
    const pwd = document.querySelector('input[name="password"]');
    const icon = document.getElementById('eyeIcon');
    if (pwd.type === 'password') { pwd.type = 'text'; icon.classList.remove('bi-eye-slash'); icon.classList.add('bi-eye'); }
    else { pwd.type = 'password'; icon.classList.remove('bi-eye'); icon.classList.add('bi-eye-slash'); }
  }
</script>
{% endblock %}
